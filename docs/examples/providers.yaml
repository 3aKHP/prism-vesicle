default:
  provider: deepseek
  model: deepseek-v4-flash

providers:
  deepseek:
    protocol: openai-chat-compatible
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    # Optional: which model "/model deepseek" switches to. Falls back to
    # models[0] (deepseek-v4-flash here) when omitted.
    defaultModel: deepseek-v4-flash
    models:
      - id: deepseek-v4-flash
        capabilities:
          streaming: true
          tools: true
        limits:
          contextWindow: 1000000
          maxOutputTokens: 65536
      - id: deepseek-reasoner
        generation:
          temperature: 0.4
          maxTokens: 8192
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
        limits:
          contextWindow: 1000000
          maxOutputTokens: 65536
          autoCompact:
            enabled: true
            threshold: 0.85
            reserveOutputTokens: 20000

  local:
    protocol: openai-chat-compatible
    baseUrl: http://127.0.0.1:11434/v1
    apiKeyEnv: LOCAL_OPENAI_COMPAT_API_KEY
    # Optional: replace Vesicle's generated branded User-Agent for this
    # provider only. Other protocol fingerprint and auth headers stay fixed.
    # userAgent: custom-client/1.0
    models:
      - qwen3

  openai:
    protocol: openai-responses
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    # The public OpenAI profile is a conformance tier, not a generic
    # "Responses-compatible" switch. HTTP is the conservative default;
    # set websocket only when this exact provider/model supports it.
    responsesProfile: openai-public
    responsesTransport: http
    defaultModel: gpt-5.6
    models:
      - id: gpt-5.6
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
          remoteCompact: true
          # Model supports the provider-native built-in web search; declaring
          # it only records the capability. The session toggle's default is
          # webSearchDefault below (/websearch overrides per session).
          builtinWebSearch: true
        # Start sessions with built-in web search on. Omit (or false) to keep
        # it off until /websearch on. Searches run on the provider side: the
        # queries leave with the request and no per-call approval applies.
        webSearchDefault: false

  # codex-beta-2026-02-06: a fingerprint-level Codex simulation profile. With
  # websocket transport it sends Codex's V2 beta wire shape (openai-beta:
  # responses_websockets=2026-02-06 header + stream:true) and falls back to
  # HTTPS/SSE on exhaustion like Codex; over HTTPS/SSE it equals openai-public.
  # Use openai-public unless you need the Codex V2 beta WebSocket fingerprint.
  # openai-codex-beta:
  #   protocol: openai-responses
  #   baseUrl: https://api.openai.com/v1
  #   apiKeyEnv: OPENAI_API_KEY
  #   responsesProfile: codex-beta-2026-02-06
  #   responsesTransport: websocket
  #   defaultModel: gpt-5.6
  #   models:
  #     - id: gpt-5.6
  #       capabilities:
  #         streaming: true
  #         tools: true
  #         reasoningTier: true
  #         reasoningContent: true

  mimo-responses:
    protocol: openai-responses
    baseUrl: https://api.xiaomimimo.com/v1
    apiKeyEnv: MIMO_API_KEY
    authMethod: x-api-key
    # This dated profile omits unsupported OpenAI fields and maps MiMo's
    # response.reasoning_text.* events. It is not OpenAI conformance.
    responsesProfile: mimo-subset-2026-07-30
    responsesTransport: http
    defaultModel: mimo-v2.5-pro
    models:
      - id: mimo-v2.5-pro
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
          temperature: true
          maxTokens: true
          remoteCompact: false

  deepseek-responses:
    protocol: openai-responses
    # DeepSeek serves /v1/responses; the adapter appends /responses to baseUrl.
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    # This dated profile follows DeepSeek's stateless HTTP Responses subset.
    # As of 2026-08-13, deepseek-v4-flash and deepseek-v4-pro support this endpoint.
    # deepseek-subset-2026-08-19 copies the frozen 2026-07-31 constraints and
    # additionally admits the provider-side built-in web search (guided Setup
    # writes this newer id; the older id stays valid without search admission).
    responsesProfile: deepseek-subset-2026-08-19
    responsesTransport: http
    defaultModel: deepseek-v4-flash
    models:
      - id: deepseek-v4-flash
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
          temperature: true
          maxTokens: true
          remoteCompact: false
          # Declares provider-native built-in web search support; pair with
          # webSearchDefault below to start new sessions with it on.
          builtinWebSearch: true
        # Off by default; remove or set true to enable per model entry.
        webSearchDefault: false
      - id: deepseek-v4-pro
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
          temperature: true
          maxTokens: true
          remoteCompact: false
          builtinWebSearch: true
          remoteCompact: false

  anthropic:
    protocol: anthropic-messages
    baseUrl: https://api.anthropic.com/v1
    apiKeyEnv: ANTHROPIC_API_KEY
    authMethod: x-api-key
    models:
      - id: claude-sonnet
        generation:
          maxTokens: 4096
        capabilities:
          tools: true
          reasoningTier: true
          vision: true
        limits:
          contextWindow: 200000
          maxOutputTokens: 8192

  google:
    protocol: gemini-generate-content
    baseUrl: https://generativelanguage.googleapis.com/v1beta
    apiKeyEnv: GEMINI_API_KEY
    authMethod: x-goog-api-key
    models:
      - id: gemini-2.5-pro
        generation:
          maxTokens: 8192
        capabilities:
          streaming: true
          tools: true
          reasoningTier: true
          reasoningContent: true
          vision: true
        limits:
          contextWindow: 1000000
          maxOutputTokens: 65536
