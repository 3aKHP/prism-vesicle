<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Prism Vesicle — light surface variant</title>
  <desc id="desc">Light-surface variant of the Prism Vesicle mark for the off-white #f5f4f0 ground. The Fresnel rim inverts to deep emerald; the beam deepens to #047857; the spectrum keeps the locked engine hues.</desc>
  <defs>
    <radialGradient id="vesicleFill" cx="50%" cy="50%" r="50%" fx="40%" fy="33%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".07"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity=".03"/>
      <stop offset="80%" stop-color="#f5f4f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fresnel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0"/>
      <stop offset="70%" stop-color="#047857" stop-opacity="0"/>
      <stop offset="86%" stop-color="#047857" stop-opacity=".10"/>
      <stop offset="95%" stop-color="#047857" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#047857" stop-opacity=".06"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c211e" stop-opacity=".07"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#1c211e" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="-60" y1="565" x2="420" y2="565">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#047857" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="spectrumGrad" gradientUnits="userSpaceOnUse" x1="620" y1="600" x2="620" y2="870">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="48%" stop-color="#fb923c"/>
      <stop offset="72%" stop-color="#f43f5e"/>
      <stop offset="92%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="fanFade" gradientUnits="userSpaceOnUse" x1="619" y1="700" x2="1120" y2="700">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fanMask"><path d="M619 585 L1120 610 L1120 860 Z" fill="url(#fanFade)"/></mask>
    <radialGradient id="flareIn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity=".7"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flareOut" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity=".08"/>
      <stop offset="70%" stop-color="#047857" stop-opacity=".025"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#1c211e" stop-opacity="0"/>
      <stop offset="80%" stop-color="#1c211e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c211e" stop-opacity=".05"/>
    </radialGradient>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur28" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="#f5f4f0"/>

  <ellipse cx="512" cy="852" rx="300" ry="60" fill="url(#pool)"/>
  <ellipse cx="512" cy="852" rx="262" ry="44" fill="none" stroke="#047857" stroke-opacity=".08" stroke-width="4" filter="url(#blur14)"/>

  <circle cx="512" cy="540" r="210" fill="#10b981" opacity=".10" filter="url(#blur28)"/>

  <circle cx="512" cy="500" r="340" fill="url(#vesicleFill)"/>
  <circle cx="512" cy="500" r="340" fill="url(#fresnel)"/>

  <path d="M 217.6 330 A 340 340 0 0 1 806.4 330" fill="none" stroke="#047857" stroke-opacity=".35" stroke-width="5" stroke-linecap="round" filter="url(#blur6)"/>
  <path d="M 794.6 663.5 A 340 340 0 0 1 663.5 794.6" fill="none" stroke="#7c3aed" stroke-opacity=".18" stroke-width="6" stroke-linecap="round" filter="url(#blur6)"/>
  <path d="M 663.5 794.6 A 340 340 0 0 1 512 840" fill="none" stroke="#d97706" stroke-opacity=".14" stroke-width="6" stroke-linecap="round" filter="url(#blur6)"/>

  <path d="M -60 523 L -60 607 L 417 574 L 417 556 Z" fill="url(#beamGrad)" filter="url(#blur14)"/>
  <path d="M -60 552 L -60 578 L 417 569 L 417 561 Z" fill="url(#beamGrad)" opacity=".85" filter="url(#blur6)"/>
  <circle cx="178" cy="565" r="52" fill="url(#flareIn)"/>

  <g>
    <path d="M 512 400 L 362 660 L 662 660 Z" fill="url(#glass)" stroke="#1c211e" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 512 400 L 362 660 L 662 660 Z" fill="none" stroke="#10b981" stroke-opacity=".25" stroke-width="7" stroke-linejoin="round" filter="url(#blur6)"/>
    <path d="M 417 565 L 619 585" stroke="#047857" stroke-opacity=".45" stroke-width="10" stroke-linecap="round" filter="url(#blur14)"/>
  </g>

  <circle cx="612" cy="582" r="24" fill="url(#flareOut)"/>
  <g mask="url(#fanMask)">
    <path d="M619 585 L1120 610 L1120 860 Z" fill="url(#spectrumGrad)" opacity=".55" filter="url(#blur14)"/>
    <path d="M619 585 L1120 660 L1120 800 Z" fill="url(#spectrumGrad)" opacity=".4" filter="url(#blur6)"/>
    <path d="M619 585 L1120 612" stroke="#22d3ee" stroke-opacity=".5" stroke-width="14" stroke-linecap="round" filter="url(#blur6)"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
