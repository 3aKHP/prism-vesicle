name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: release
        name: Require an annotated version tag on the default branch history
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(jq -r '.version' package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$TAG_SHA" FETCH_HEAD
          case "$VERSION" in
            *-rc.*) CHANNEL=rc ;;
            *-*) CHANNEL=beta ;;
            *) CHANNEL=stable ;;
          esac
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$TAG_SHA" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$CHANNEL" >> "$GITHUB_OUTPUT"

  build:
    name: Rebuild and verify tagged release
    needs: metadata
    uses: ./.github/workflows/release-build.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.sha }}
      expected_version: ${{ needs.metadata.outputs.version }}
      artifact_prefix: publish
      retention_days: 30

  github-release:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          pattern: publish-*
          merge-multiple: true
          path: release
      - name: Write checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Compose channel-aware release notes
        id: notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            rc)
              cat > release-notes.md <<'CHANNEL_EOF'
          ## Release candidate channel and known limits / RC 频道与已知限制

          `%VERSION%` is a release candidate published to npm's `next` dist-tag. The `latest` dist-tag intentionally keeps tracking the newest beta, so `npm install -g prism-vesicle` continues to install the beta line; install the candidate explicitly with `npm install -g prism-vesicle@next` or by pinning `%VERSION%`. Release candidates are stabilization builds for early testing and may still change before the stable release.

          `%VERSION%` 是发布候选 (RC),发布到 npm 的 `next` dist-tag。`latest` dist-tag 会有意继续跟随最新 Beta,因此 `npm install -g prism-vesicle` 仍会安装 Beta 线;请使用 `npm install -g prism-vesicle@next` 或固定 `%VERSION%` 来显式安装候选版本。发布候选是面向早期测试的稳定化构建,在稳定版发布前仍可能调整。

          CHANNEL_EOF
              ;;
            beta)
              cat > release-notes.md <<'CHANNEL_EOF'
          ## Beta channel and known limits / Beta 频道与已知限制

          npm's `latest` dist-tag intentionally tracks the newest beta during the beta line, so `npm install -g prism-vesicle` installs `%VERSION%` once publication completes. Pin an explicit older version to remain on an alpha build. This policy will be reconsidered before an RC or stable `1.0.0` release.

          Beta 阶段中,npm 的 `latest` dist-tag 会有意跟随最新 Beta,因此发布完成后 `npm install -g prism-vesicle` 会安装 `%VERSION%`。如需继续停留在 Alpha 构建,请显式固定旧版本。进入 RC 或稳定 `1.0.0` 前会重新评估该策略。

          CHANNEL_EOF
              ;;
            stable)
              cat > release-notes.md <<'CHANNEL_EOF'
          ## Stable channel and known limits / 稳定频道与已知限制

          npm's `latest` dist-tag tracks the newest stable release, so `npm install -g prism-vesicle` installs `%VERSION%` once publication completes. Earlier prerelease builds remain available through the `next` dist-tag and explicit versions.

          npm 的 `latest` dist-tag 跟随最新稳定版,发布完成后 `npm install -g prism-vesicle` 会安装 `%VERSION%`。更早的预发布构建仍可通过 `next` dist-tag 与显式版本号获取。

          CHANNEL_EOF
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          cat >> release-notes.md <<'SHARED_EOF'

          Provider-native search is explicit and provider-scoped: `/websearch on` sends queries to the selected provider without a per-call tool approval, and is admitted only for configured Gemini `generateContent`, OpenAI Responses `openai-public`, and `deepseek-subset-2026-08-19` models with `capabilities.builtinWebSearch`. Citations are optional provider behavior. Existing `deepseek-subset-2026-07-31` configurations are not migrated automatically and remain search-disabled until changed deliberately. The applicable OpenAI, DeepSeek, Gemini, and Tavily dogfood evidence is dated 2026-08-20; opt-in real-endpoint suites report missing prerequisites as unavailable, never passed.

          供应商原生搜索必须显式开启且受供应商范围限制:`/websearch on` 会将查询发送到当前供应商,不会逐次弹出工具批准;仅在模型声明 `capabilities.builtinWebSearch` 且使用已支持的 Gemini `generateContent`、OpenAI Responses `openai-public` 或 `deepseek-subset-2026-08-19` 时可用。引用由供应商选择是否返回。现有 `deepseek-subset-2026-07-31` 配置不会自动迁移,必须主动修改后才能使用搜索。适用的 OpenAI、DeepSeek、Gemini 与 Tavily dogfood 证据日期为 2026-08-20;可选真实端点测试在前置条件缺失时记为不可用,不计为通过。

          MCP resource, audio, URL/link, and unknown result kinds remain deferred: Vesicle omits them without auto-fetch or prompt injection. See `STATUS.md` and Issue #177 for the current boundary.

          MCP resource、audio、URL/link 与未知结果类型仍处于延后状态:Vesicle 会忽略它们,不自动抓取,也不注入提示。当前边界见 `STATUS.md` 与 Issue #177。

          ## Windows code-signing status / Windows 代码签名状态

          The Windows executable and installer in `%VERSION%` are not Authenticode-signed. Windows signing is deferred until the project has a stronger basis for a signing provider, with no version deadline. Download only from this official GitHub Release and verify the file against `SHA256SUMS.txt`. Do not disable Windows security features globally.

          `%VERSION%` 中的 Windows 可执行文件和安装器没有 Authenticode 签名。Windows 签名推迟到项目具备引入签名服务的条件后再考虑，不设版本截止期限。请只从本 GitHub Release 官方页面下载，并使用 `SHA256SUMS.txt` 核对文件；不要在系统范围内关闭 Windows 安全功能。

          See the [Code Signing Policy](https://github.com/3aKHP/prism-vesicle/blob/main/CODE_SIGNING_POLICY.md) / 参见[代码签名政策](https://github.com/3aKHP/prism-vesicle/blob/main/CODE_SIGNING_POLICY.zh-CN.md)。
          SHARED_EOF
          sed -i "s/%VERSION%/$VERSION/g" release-notes.md
          {
            printf 'body<<BODY_EOF\n'
            cat release-notes.md
            printf 'BODY_EOF\n'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Prism Vesicle v${{ needs.metadata.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ needs.metadata.outputs.channel != 'stable' }}
          make_latest: ${{ needs.metadata.outputs.channel == 'stable' }}
          generate_release_notes: true
          files: release/*

  npm:
    name: Publish npm package
    needs: [metadata, build, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # npm Trusted Publishing requires Node 24's npm 11 OIDC implementation;
      # setup-node also writes the public registry configuration.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the verified package if it is not already present
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          if npm view "prism-vesicle@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "prism-vesicle@$VERSION is already published; nothing to retry."
            exit 0
          fi
          case "$CHANNEL" in
            rc) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"
