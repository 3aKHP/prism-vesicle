name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: release
        name: Require an annotated version tag on the default branch history
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(jq -r '.version' package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$TAG_SHA" FETCH_HEAD
          case "$VERSION" in
            *-rc.*) CHANNEL=rc ;;
            *-*) CHANNEL=beta ;;
            *) CHANNEL=stable ;;
          esac
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$TAG_SHA" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$CHANNEL" >> "$GITHUB_OUTPUT"

  build:
    name: Rebuild and verify tagged release
    needs: metadata
    uses: ./.github/workflows/release-build.yml
    with:
      checkout_ref: ${{ needs.metadata.outputs.sha }}
      expected_version: ${{ needs.metadata.outputs.version }}
      artifact_prefix: publish
      retention_days: 30

  github-release:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          pattern: publish-*
          merge-multiple: true
          path: release
      - name: Write checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      # The release body is composed from the paired bilingual CHANGELOG by
      # scripts/release/compose-notes.ts. GitHub's generate_release_notes
      # autogen is deliberately absent: its compare-base fallback dumped the
      # full history into the first non-prerelease body (issue #268 item 10).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Compose bilingual release notes from the paired CHANGELOG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bun scripts/release/compose-notes.ts --version "$VERSION" --out release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Prism Vesicle v${{ needs.metadata.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.metadata.outputs.channel != 'stable' }}
          make_latest: ${{ needs.metadata.outputs.channel == 'stable' }}
          files: release/*

  npm:
    name: Publish npm package
    needs: [metadata, build, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # npm Trusted Publishing requires Node 24's npm 11 OIDC implementation;
      # setup-node also writes the public registry configuration.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the verified package if it is not already present
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          if npm view "prism-vesicle@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "prism-vesicle@$VERSION is already published; nothing to retry."
            exit 0
          fi
          case "$CHANNEL" in
            rc) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"
