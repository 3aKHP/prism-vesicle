name: Close Issues on Release to Main

on:
  pull_request:
    types: [closed]
    branches:
      - main # release PRs land on main

permissions:
  contents: read
  issues: write
  pull_requests: read

jobs:
  close-released-issues:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Close issues declared by the PRs this release carried into main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release/close-bridged-issues.ts
