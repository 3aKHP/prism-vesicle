name: Close Issues on Release to Main

on:
  pull_request:
    types: [closed]
    branches:
      - main # release PRs land on main

permissions:
  contents: read
  issues: write

jobs:
  close-released-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Find and close issues referenced by closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub's native auto-close only fires for keywords in PRs that
            // target the default branch. Closing keywords carried by commits
            // that reached `main` through `develop` never fired, so this job
            // closes those issues when a release PR merges into `main`.
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const commits = await github.paginate(github.rest.repos.compareCommits, {
              owner,
              repo,
              base: pr.base.sha,
              head: pr.head.sha,
            });

            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const candidates = new Set();
            const collect = (text) => {
              if (!text) return;
              for (const match of text.matchAll(issueRegex)) {
                candidates.add(Number(match[1]));
              }
            };
            collect(pr.body);
            for (const commit of commits) {
              collect(commit.commit.message);
            }

            const failures = [];
            for (const issueNumber of candidates) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });
                if (issue.pull_request) {
                  console.log(`#${issueNumber} is a pull request; skipping.`);
                  continue;
                }
                if (issue.state !== "open") {
                  console.log(`#${issueNumber} is already ${issue.state}; skipping.`);
                  continue;
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `This issue has been automatically closed as part of the release to \`main\` in #${pr.number}.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed",
                });
                console.log(`Closed issue #${issueNumber}.`);
              } catch (err) {
                console.error(`Failed to close issue #${issueNumber}:`, err);
                failures.push(issueNumber);
              }
            }
            if (failures.length > 0) {
              core.setFailed(`Failed to close: ${failures.map((n) => `#${n}`).join(", ")}`);
            }
