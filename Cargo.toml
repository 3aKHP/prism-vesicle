[workspace]
members = ["rust/cli", "rust/session", "rust/attachments"]
resolver = "3"

[workspace.package]
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.11.1"
