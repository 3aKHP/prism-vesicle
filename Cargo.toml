[workspace]
members = ["rust/cli", "rust/session", "rust/attachments", "rust/mcp-probe"]
resolver = "3"

[workspace.package]
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
